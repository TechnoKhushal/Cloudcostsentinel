name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-checks:
    name: Backend Tests & Compilation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sentinel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sentinel_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
          cache: "pip"

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y postgresql-client

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # The standalone pattern demo still validates against the published schema package.
          # Keep it test-only and skip its unrelated PyTorch/model-serving dependencies.
          pip install --no-deps "strands-decider==0.2.0"

      - name: Audit Python dependencies
        run: |
          python -m pip install pip-audit
          pip-audit -r requirements.txt

      - name: Verify Python Compilation
        run: |
          python -m compileall -q backend patterns scripts tests

      - name: Run Backend Tests
        run: |
          python -m pytest -v tests

      - name: Apply Supabase migrations and test tenant isolation
        env:
          SUPABASE_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sentinel_test
        run: |
          psql "$SUPABASE_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/postgres_migrations_bootstrap.sql
          for migration in supabase/migrations/*.sql; do
            psql "$SUPABASE_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration"
          done
          psql "$SUPABASE_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/postgres_migrations_smoke.sql

      - name: Run Pattern Tests
        run: |
          python -m pytest -v patterns/threshold_aware_anomaly_response/test_pattern.py

      - name: Execute Standalone Pattern Demo
        run: |
          python patterns/threshold_aware_anomaly_response/standalone_example.py

  frontend-checks:
    name: Frontend Build & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Frontend API Tests
        working-directory: frontend
        run: npm test

      - name: Lint Frontend
        working-directory: frontend
        run: npm run lint

      - name: Typecheck and Build Bundle
        working-directory: frontend
        run: npm run build
